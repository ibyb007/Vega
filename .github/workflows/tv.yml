name: Build Android TV ARMv7 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android Native Project
        env:
          APP_VARIANT: standalone
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build ARMv7 Signed Release APK
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: |
          KEYSTORE_PATH=$(realpath app/release.keystore)
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=armeabi-v7a \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon

      - name: Extract ARMv7 APK
        run: |
          mkdir -p output_apk
          ARMV7_APK=$(find android/app/build/outputs/apk/release -name "*armeabi-v7a*.apk" -o -name "*.apk" | head -1)
          cp "$ARMV7_APK" output_apk/Vega-Android-TV-armv7.apk
          ls -la output_apk/

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Sony-TV-armv7
          path: output_apk/Vega-Android-TV-armv7.apk
          if-no-files-found: error
