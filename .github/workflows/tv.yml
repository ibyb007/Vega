name: Build Android TV Release APK

# Controls how each run is labeled in the Actions run list (not just the
# static workflow name above) -- a canary dispatch shows up as its own
# "Build Canary APK" run instead of blending in with stable release runs.
run-name: ${{ inputs.channel == 'canary' && 'Build Canary APK' || 'Build Android TV Release APK' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options:
          - stable
          - canary
        default: stable
      version:
        description: 'Stable: version to release, e.g. 5.2.0 (empty = package.json). Canary: optional base version (empty = latest stable, numbered 5.2.0 (1), (2), ...)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

# Avoid two manual runs racing to publish/overwrite releases out of order.
concurrency:
  group: build-tv-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Version & Generate Auto-Incremented Code
        id: release_meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -e
          git fetch --tags origin 2>/dev/null || true

          # Only trigger left is workflow_dispatch, so the channel input is
          # always present -- "stable" unless switched to "canary".
          CHANNEL="${{ inputs.channel }}"

          # Version typed into the "Run workflow" dialog. A leading "v" is
          # accepted and stripped (v5.2.0 -> 5.2.0).
          TYPED="$(echo "$INPUT_VERSION" | tr -d '[:space:]')"
          TYPED="${TYPED#v}"
          if [ -n "$TYPED" ] && ! echo "$TYPED" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::Invalid version '$TYPED'. Use something like 5.2.0"
            exit 1
          fi

          # Android versionCode: always grows, whatever the channel.
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          CANARY_NUMBER=0

          if [ "$CHANNEL" = "canary" ]; then
            # Canary builds hang off a stable version: after stable 5.2.0 the
            # next canaries are 5.2.0 (1), 5.2.0 (2), ... until the next
            # stable version restarts the count.
            if [ -n "$TYPED" ]; then
              VERSION_NAME="$TYPED"
            else
              VERSION_NAME="$(git tag --list 'v[0-9]*' | grep -Ev -- '-canary' | sed 's/^v//' | sort -V | tail -n 1)"
              if [ -z "$VERSION_NAME" ]; then
                VERSION_NAME=$(node -p "require('./package.json').version || '5.0.1'")
              fi
            fi
            LAST_N="$(git tag --list "v${VERSION_NAME}-canary.*" | sed "s/^v${VERSION_NAME}-canary\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1)"
            CANARY_NUMBER=$(( ${LAST_N:-0} + 1 ))

            DISPLAY_VERSION="${VERSION_NAME} (${CANARY_NUMBER})"
            TAG_NAME="v${VERSION_NAME}-canary.${CANARY_NUMBER}"
            RELEASE_NAME="Vega TV Canary v${DISPLAY_VERSION}"
            APK_BASE="Vega-TV-Canary-v${VERSION_NAME}-${CANARY_NUMBER}"
            PRERELEASE=true
            MAKE_LATEST=false
          else
            if [ -n "$TYPED" ]; then
              VERSION_NAME="$TYPED"
            else
              VERSION_NAME=$(node -p "require('./package.json').version || '5.0.1'")
            fi
            TAG_NAME="v${VERSION_NAME}"
            if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
              echo "::error::Release ${TAG_NAME} already exists. Enter a new version number."
              exit 1
            fi
            DISPLAY_VERSION="${VERSION_NAME}"
            RELEASE_NAME="Vega TV Stable v${VERSION_NAME}"
            APK_BASE="Vega-TV-v${VERSION_NAME}"
            PRERELEASE=false
            MAKE_LATEST=true
          fi

          # The 4 newest changes since the previous release.
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" -n 4)
          else
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 4)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="* TV optimizations and bug fixes."
          fi

          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "canary_number=$CANARY_NUMBER" >> $GITHUB_OUTPUT
          echo "display_version=$DISPLAY_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "apk_base=$APK_BASE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "make_latest=$MAKE_LATEST" >> $GITHUB_OUTPUT

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Set up Go for WARP binary build
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Build patched libusque (Cloudflare WARP) for Android
        # Upstream usque (https://github.com/Diniboy1123/usque) ships a Go
        # binary that can't resolve DNS on most Android devices -- Android
        # apps have no readable /etc/resolv.conf, and this binary is built
        # CGO_ENABLED=0 (no cgo resolver fallback available), so Go's pure-Go
        # resolver falls back to a hardcoded, unreachable loopback
        # nameserver and every lookup fails. native-src/usque/main.go patches
        # this to accept real DNS servers from WarpModule.kt via the
        # USQUE_DNS_SERVERS env var. Built here (not committed as a binary)
        # so it always reflects that patch and stays reproducible.
        run: |
          set -e
          USQUE_COMMIT="6aa03fc97d12"
          git clone --quiet https://github.com/Diniboy1123/usque.git /tmp/usque-src
          cd /tmp/usque-src
          git checkout --quiet "$USQUE_COMMIT"
          cp "$GITHUB_WORKSPACE/native-src/usque/main.go" ./main.go

          build_abi() {
            local goarch="$1" goarm="$2" abi="$3"
            echo "Building libusque.so for $abi (GOARCH=$goarch${goarm:+, GOARM=$goarm})"
            mkdir -p "$GITHUB_WORKSPACE/native-src/android/jniLibs/$abi"
            CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" GOARM="$goarm" \
              go build -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/native-src/android/jniLibs/$abi/libusque.so" .
          }

          build_abi arm64 "" arm64-v8a
          build_abi arm 7 armeabi-v7a

      - name: Build ciadpi (ByeDPI Anti-DPI) for Android
        # Upstream: https://github.com/hufrea/byedpi -- a small, dependency-free
        # C SOCKS5 proxy that applies TLS-fragmentation/desync tricks per
        # connection. Built with a musl toolchain (Zig's bundled clang, from
        # PyPI) as static-PIE, the same shape as the ciadpi shipped in the
        # original mobile app. Do NOT switch this back to a glibc cross-compiler
        # (gcc-aarch64-linux-gnu etc.): glibc-static binaries start up
        # differently (extra syscalls) and did not start inside the Android app
        # sandbox, while musl-static ones do.
        run: |
          set -e
          python3 -m venv /tmp/zigenv
          /tmp/zigenv/bin/pip install --quiet ziglang==0.16.0
          ZIGCC="/tmp/zigenv/bin/python -m ziglang cc"
          BYEDPI_TAG="v0.17.3"
          git clone --quiet --depth 1 --branch "$BYEDPI_TAG" https://github.com/hufrea/byedpi.git /tmp/byedpi-src
          cd /tmp/byedpi-src
          SRC="packets.c main.c conev.c proxy.c desync.c mpool.c extend.c"
          CFLAGS="-D_DEFAULT_SOURCE -I. -std=c99 -O2 -w -s -fPIE -pie -static"

          build_abi() {
            local target="$1" extra="$2" abi="$3"
            local out="$GITHUB_WORKSPACE/native-src/android/jniLibs/$abi/libciadpi.so"
            echo "Building libciadpi.so for $abi ($target)"
            mkdir -p "$(dirname "$out")"
            $ZIGCC -target "$target" $extra $CFLAGS -o "$out" $SRC
            file "$out"
            file "$out" | grep -q "statically linked\|static-pie" || { echo "ERROR: $abi build is not static"; exit 1; }
          }

          build_abi aarch64-linux-musl "" arm64-v8a
          build_abi arm-linux-musleabihf "-mcpu=generic+v7a" armeabi-v7a

      - name: Generate Android Native Project
        env:
          APP_VARIANT: standalone
          APP_CHANNEL: ${{ steps.release_meta.outputs.channel }}
          APP_CANARY_NUMBER: ${{ steps.release_meta.outputs.canary_number }}
          APP_VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || vars.TMDB_API_KEY }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android TV Release APKs
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
          APP_VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
          # Gradle re-reads app.config.js when it bundles the app, so the
          # channel has to be set here too (not only at prebuild).
          APP_CHANNEL: ${{ steps.release_meta.outputs.channel }}
          APP_CANARY_NUMBER: ${{ steps.release_meta.outputs.canary_number }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || vars.TMDB_API_KEY }}
          MYAPP_UPLOAD_STORE_FILE: "release.keystore"
          MYAPP_UPLOAD_STORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          MYAPP_UPLOAD_KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          MYAPP_UPLOAD_KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output_apks
          # e.g. Vega-TV-v5.2.0 or Vega-TV-Canary-v5.2.0-1
          BASE="${{ steps.release_meta.outputs.apk_base }}"

          find android/app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | while read -r file; do
            filename=$(basename "$file")
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$file" "output_apks/${BASE}-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$file" "output_apks/${BASE}-armeabi-v7a.apk"
            else
              cp "$file" "output_apks/${BASE}-universal.apk"
            fi
          done
          ls -la output_apks/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vega-TV-${{ steps.release_meta.outputs.channel }}-APKs
          path: output_apks/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          make_latest: ${{ steps.release_meta.outputs.make_latest }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          body: |
            ${{ steps.release_meta.outputs.channel == 'canary' && '> ⚠️ **Canary build** -- a manually-triggered test build. May be unstable; not shown as the repo''s Latest release.' || '' }}

            ## What's Changed
            ${{ steps.release_meta.outputs.changelog }}

            ---
            * **Channel**: `${{ steps.release_meta.outputs.channel }}`
            * **App Version**: `${{ steps.release_meta.outputs.display_version }}`
            * **Build Code (versionCode)**: `${{ steps.release_meta.outputs.version_code }}`
            * **Target Architecture**: Android TV (`armeabi-v7a`, `arm64-v8a`)
          files: output_apks/*.apk
          generate_release_notes: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
