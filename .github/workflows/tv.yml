name: Build Android TV Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Version & Generate Changelog
        id: release_meta
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version || '4.0.5'")
          VERSION_CODE=${{ github.run_number }}
          TAG_NAME="v${VERSION_NAME}-tv-${VERSION_CODE}"

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)")
          else
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 10)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="* TV UI optimizations and bug fixes."
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Generate Android Native Project
        env:
          APP_VARIANT: standalone
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android TV Release APKs
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
          MYAPP_UPLOAD_STORE_FILE: "release.keystore"
          MYAPP_UPLOAD_STORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          MYAPP_UPLOAD_KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          MYAPP_UPLOAD_KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output_apks
          find android/app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vega-TV-Release-APKs
          path: output_apks/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: Vega TV ${{ steps.release_meta.outputs.tag_name }}
          body: |
            ## What's Changed
            ${{ steps.release_meta.outputs.changelog }}

            ---
            * **Version Name**: `${{ steps.release_meta.outputs.version_name }}`
            * **Version Code**: `${{ steps.release_meta.outputs.version_code }}`
            * **Target Platform**: Android TV (`armeabi-v7a`, `arm64-v8a`)
          files: output_apks/*.apk
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
