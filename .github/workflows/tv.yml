name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-tv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android TV Native Project
        env:
          APP_VARIANT: standalone
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android TV Release APK (ARMv7 Fast Build)
        working-directory: ./android
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=armeabi-v7a \
            -Pandroid.injected.signing.store.file=$(realpath app/debug.keystore) \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon

      - name: Extract ARMv7 APK
        run: |
          mkdir -p apks
          ARMV7_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$ARMV7_APK" apks/Vega-Android-TV-armv7.apk
          ls -la apks/

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Android-TV-v7a
          path: apks/Vega-Android-TV-armv7.apk
          if-no-files-found: error
