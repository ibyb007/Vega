name: Build Android TV ARMv7 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android Native Project
        env:
          APP_VARIANT: standalone
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build ARMv7 Release APK
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=armeabi-v7a \
            -Pandroid.injected.signing.store.file=$(realpath app/debug.keystore) \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p output_apk
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_FILE" output_apk/Vega-Android-TV-armv7.apk

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Vega-TV-ARMv7-APK
          path: output_apk/Vega-Android-TV-armv7.apk
          if-no-files-found: error
